name: host-credentials
description: >
  A container that reaches a third-party API using a credential held on the host.
base:
  image: ubuntu:24.04

passthrough:
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY

provision:
  setup_cmds:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates jq
    - test -n "$ANTHROPIC_API_KEY"

readiness:
  - name: credential-present
    command: test -n "$ANTHROPIC_API_KEY"
