name: web-service
description: >
  A Python web service reachable from the host, with an HTTP readiness gate.
base:
  image: ubuntu:24.04

access:
  ports:
    - host: 31080
      container: 8000
      label: API
      path: /health

provision:
  setup_cmds:
    - apt-get update && apt-get install -y --no-install-recommends python3 curl
    - |
      mkdir -p /srv/app
      cat > /srv/app/server.py << 'EOF'
      from http.server import BaseHTTPRequestHandler, HTTPServer
      import json

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.send_header("Content-Type", "application/json")
              self.end_headers()
              self.wfile.write(json.dumps({"status": "ok"}).encode())

      HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
      EOF
    - nohup python3 /srv/app/server.py > /var/log/app.log 2>&1 &

update:
  cmds:
    - pkill -f '[s]erver.py' || true
    - nohup python3 /srv/app/server.py > /var/log/app.log 2>&1 &

readiness:
  - name: http-ok
    http:
      url: http://localhost:8000/health
      expect_json: { "status": "ok" }
