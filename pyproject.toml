[project]
name = "amplifier-digital-twin-universe"
version = "0.2.0"
description = "Stand up isolated, realistic environments from a declarative profile, and manage them for their whole life."
readme = "README.md"
authors = [
    { name = "David Koleczek", email = "45405824+DavidKoleczek@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amplifier-bundle-digital-twin-universe @ git+https://github.com/microsoft/amplifier-bundle-digital-twin-universe@main",
    "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@main",
    "pydantic>=2.13,<3.0",
    # The shipped model implementation reaches Anthropic by default, and the
    # engine mounts a provider only when its client library is importable.
    "anthropic>=1.0,<2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0,<3.0"]
gemini = ["google-genai>=1.0,<2.0"]

[project.scripts]
amplifier-digital-twin-universe = "amplifier_digital_twin_universe.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "5 days"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "ty>=0.0.71",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PT",   # flake-pytest-style
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",   # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
